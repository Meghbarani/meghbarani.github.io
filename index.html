<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>মেঘবরণী — শাড়ি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --khadi:#F0EADC; --surface:#FBF8F2; --ink:#1C1726; --ink-soft:#57506A;
  --madder:#97262B; --zari:#B08526; --line:rgba(28,23,38,.16);
  --display:'Noto Serif Bengali','Noto Serif',serif;
  --text:'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --khadi:#15121D; --surface:#1B1726; --ink:#EFE8DA; --ink-soft:#B3A9BE;
  --madder:#D0585B; --zari:#D9AE4E; --line:rgba(239,232,218,.18);
}}
:root[data-theme="dark"]{
  --khadi:#15121D; --surface:#1B1726; --ink:#EFE8DA; --ink-soft:#B3A9BE;
  --madder:#D0585B; --zari:#D9AE4E; --line:rgba(239,232,218,.18);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--khadi);color:var(--ink);
  font-family:var(--text);font-size:17px;line-height:1.8;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--madder);outline-offset:3px}
.wrap{max-width:1020px;margin:0 auto;padding:0 18px}

.band{height:0}
.band::before{content:"";display:block;height:4px;background:var(--zari);opacity:.85}
.band::after{content:"";display:block;height:10px;opacity:.85;
  background-image:linear-gradient(135deg,var(--zari) 25%,transparent 25.5%),
                   linear-gradient(225deg,var(--zari) 25%,transparent 25.5%);
  background-size:13px 13px}

header{padding:26px 0 20px;text-align:center}
header h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,7vw,44px);margin:0;line-height:1.4}
header p{margin:6px 0 0;color:var(--ink-soft);font-size:17px}
.shopshot{margin:0;width:100%}
.shopshot img{width:100%;height:auto;display:block}

h2{font-family:var(--display);font-weight:600;font-size:26px;margin:44px 0 6px;text-align:center;line-height:1.5}
.sub{text-align:center;color:var(--ink-soft);margin:0 0 26px;font-size:16px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-bottom:10px}
@media (max-width:860px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:620px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}}
.card{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column}
.pic{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--surface)}
.pic img{width:100%;height:100%;object-fit:contain}
.sold{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(28,23,38,.58);color:#FFF6E6;font-family:var(--display);font-size:17px;text-align:center;padding:10px}
.card-body{padding:12px 13px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.card h3{font-family:var(--display);font-weight:400;font-size:17px;margin:0;line-height:1.55}
.price{font-size:17px;font-weight:600;margin:4px 0 0}
.ask{margin-top:auto;padding-top:10px;font-size:15px;color:var(--madder);text-decoration:none;
  border-bottom:1px solid transparent;align-self:flex-start;line-height:1.5}
.ask:hover{border-bottom-color:var(--madder)}

.contact{background:var(--surface);margin-top:52px;padding:38px 0 42px;text-align:center}
.contact h2{margin-top:0}
.contact p{margin:0 0 18px;color:var(--ink-soft)}
.btn{display:inline-block;background:var(--madder);color:#FFF8EE;text-decoration:none;
  font-size:17px;font-weight:500;padding:13px 30px;font-family:var(--text)}
.btn:hover{background:#7d1f23}
.lines{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:8px;font-size:16px}
.lines a{color:inherit;text-decoration:none;border-bottom:1px solid var(--zari)}
footer{padding:22px 0 30px;text-align:center;font-size:14px;color:var(--ink-soft)}

/* ── single saree page ── */
a.pic{display:block}
.product{padding-top:22px;padding-bottom:10px}
.back{color:var(--madder);text-decoration:none;font-size:16px}
.back:hover{text-decoration:underline}
.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:start;margin-top:16px}
@media (max-width:760px){.layout{grid-template-columns:1fr;gap:22px}}
.photo{position:relative;background:var(--surface);border:1px solid var(--line)}
.photo img{width:100%;height:auto;max-height:82vh;object-fit:contain;margin:0 auto}
.photo.empty{aspect-ratio:3/4}
.photo .soldtag{position:absolute;top:14px;left:14px;background:var(--ink);color:var(--khadi);font-size:14px;padding:3px 12px}
.thumbs{display:flex;gap:10px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:0 0 72px;height:96px;padding:0;border:2px solid transparent;background:var(--surface);cursor:pointer}
.thumbs button[aria-current="true"]{border-color:var(--madder)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,5vw,36px);margin:0;line-height:1.45}
.p-price{font-size:26px;font-weight:600;margin:6px 0 18px}
.about{white-space:pre-line;margin:0 0 26px}
.wa-btn{display:inline-block;background:#1f8f4e;color:#fff;text-decoration:none;font-size:17px;font-weight:500;padding:13px 28px}
.wa-btn:hover{background:#17733e}
.hint{font-size:14px;color:var(--ink-soft);margin:12px 0 0}
.notice{text-align:center;color:var(--madder);margin:24px 12px 0}
</style>
</head>
<body>

<div class="band" aria-hidden="true"></div>

<header class="wrap">
  <!-- <h1>মেঘবরণী</h1>
  <p>হাতে বোনা শাড়ির সংগ্রহ</p> -->
</header>

<!-- দোকানের ছবি: images/shop.jpg নামে আপলোড করুন -->
<div class="shopshot"><img src="images/shop.jpg" alt="আমাদের সংগ্রহ" onerror="this.style.display='none'"></div>

<main>
  <!-- সব শাড়ি -->
  <div id="listView">
    <h2>এখন যা আছে</h2>
    <p class="sub">যে শাড়িটি পছন্দ হয়েছে, তাতে ক্লিক করে বিস্তারিত দেখুন।</p>
    <div class="grid" id="grid"></div>
  </div>
  <!-- একটি শাড়ির পাতা -->
  <div id="productView" class="wrap product" hidden></div>
</main>

<section class="contact">
  <div class="wrap">
    <!-- <h2>আরও দেখতে চান?</h2>
    <p>বার্তা পাঠান, আমরা আরও ছবি ও ভিডিও পাঠিয়ে দেব।</p> -->
    <a class="btn" id="mainWa" href="#">হোয়াটসঅ্যাপে বার্তা পাঠান</a>
    <ul class="lines">
      <li>ফোন: <a href="tel:+919999999999">+91 90647 76880</a></li>
      <!-- <li>ইনস্টাগ্রাম <a href="https://instagram.com/">@meghbarani</a></li> -->
    </ul>
  </div>
</section>

<div class="band" aria-hidden="true"></div>
<footer>© <span id="yr"></span> মেঘবরণী</footer>

<script>
/* ═══════════════════════════════════════════════════════════
   শুধু এই অংশটুকু বদলাবেন

   ১. PHONE — আপনার হোয়াটসঅ্যাপ নম্বর, ৯১ দিয়ে শুরু, শুধু সংখ্যা।
   ২. প্রতিটি শাড়ি একটি লাইন। নতুন শাড়ি যোগ করতে একটি লাইন কপি
      করে নিচে বসান, বিক্রি হয়ে গেলে লাইনটি মুছে দিন।
        name  = শাড়ির নাম
        price = দাম
        img   = images ফোল্ডারে ছবির নাম
        sold: true  লিখলে "বিক্রি হয়ে গেছে" লেখা দেখাবে
        about: "..."   শাড়ি সম্পর্কে লেখা, শাড়ির নিজের পাতায় দেখাবে
                       (নতুন লাইনের জন্য \n লিখুন)
        photos: ["images/...", "images/..."]   আরও ছবি থাকলে
   ═══════════════════════════════════════════════════════════ */

var PHONE = "+919064776880";

var SAREES = [
  { name: "রক্তিমা",price: "₹ ৮৯৯", img: "images/sharee-1.jpg" , about: `" লালের আবেগ আর সোনালির ঐতিহ্য—এক শাড়িতে বাঙালিয়ানার চিরন্তন সৌন্দর্য।।"\n\nনাম: মাহেশ্বরী সিল্ক`},
  { name: "অরুণিমা",price: "₹৬৯৯", img: "images/sharee-2.jpg", about: `"শান্ত লালিমায় সোনালি স্বপ্ন—অরুণিমা।।"\n\nনাম: মাহেশ্বরী সিল্ক` },
  { name: "হেমলতা",price: "₹৯৫০", img: "images/sharee-3.jpg", about: `" গভীর সবুজে সোনালি ছোঁয়া—ঐতিহ্যের এক অনন্য প্রকাশ ।।"\n\nনাম: কাকিনাড়া ` },
  { name: "কাঞ্চনপ্রভা",price: "₹৯৫০", img: "images/sharee-4.jpg", about: `" সোনালি আভায় উৎসবের উজ্জ্বলতা…।।"\n\nনাম: কাকিনারা` },
  { name: "যামিনী",price: "₹১১৯০", img: "images/sharee-5.jpg", about: `"গভীর বেগুনিতে রঙিন নকশার মায়াবী ছোঁয়া  ।।"\n\nনাম: বোমকাই ` },
  { name: "বনানী",price: "₹৬৪৯", img: "images/sharee-6.jpg", about: `" প্রকৃতির ছোঁয়া এবার তোমার সাজে ।।"\n\nনাম: মঙ্গলগিরি` },
  { name: "ঐশ্বর্যা",price: "₹১০৯৯", img: "images/sharee-7.jpg", about: `" লাল সাদার বাঙালিয়ানায় এবার আভিজাত্যের ছোঁয়া ।।"\n\nনাম: তসর সিল্ক` },
  { name: "তসর - কথা",price: "₹১১৯৯", img: "images/sharee-8.jpg", about: `" এবার তসরের রঙে বাংলার চিরন্তনের ছোঁয়া  ।।"\n\nনাম: তসর সিল্ক` },
  { name: "সোনাঝুরি",price: "₹৬৪৯", img: "images/sharee-9.jpg", about: `" রুদ্র ছায়ার সোনালী আভায়, তোমার সাজে মিশে থাকা যেন এক টুকরো সোনালী সকাল ।।"\n\nনাম: মঙ্গলগিরি` },
  { name: "সোহাগ লতা ",price: "₹১৭৫০", img: "images/sharee-10.jpg", about: `" রাঙা  আবেগ আর সোনালীতে বোনা এক টুকরো গল্প ।।"\n\nনাম: বেনারসি আর্ট সিল্ক`},
  { name: "মেঘমালা",price: "₹১০৫০", img: "images/sharee-11.jpg", about: `" তোমার সাথে থাকুক এক টুকরো নীরব মুগ্ধতা ।।"\n\nনাম: হ্যান্ডলুম সিল্ক` },
  { name: "লাবণ্য",price: "₹৯৯৯", img: "images/sharee-12.jpg", about: `" মেঘবরণীর সাজে সিঁদুর ছোঁয়ার আবেশ, এ শুধু যেন সাজ নয় এক অনুভব করা মুহূর্ত ।।"\n\nনাম: ধূপছায়া মঙ্গলগিরি` },
  { name: "নীলরাগ",price: "₹১৪৪৯", img: "images/sharee-13.jpg", about: `" কখনো রঙ কথা বলে...\nআসমানী বুনোটে যেন লুকিয়ে রয়েছে অনেক না বলা গল্প ।।"\n\nনাম: রেশম কাতান` },
  { name: "কনক প্রভা",price: "₹১১৯৯", img: "images/sharee-14.jpg", about: `"  উৎসব হোক কিংবা বিশেষ কোনো দিন—\nকনকপ্রভার আভায় সাজটা হোক একটু বেশি আপন ।।"\n\nনাম:  মাহেশ্বরী সিল্ক` },
  { name: "রূপমঞ্জরী",price: "₹১১৯৯", img: "images/sharee-15.jpg", about: `"  আভিজাত্যের রঙে রাঙানো এক মায়াবী গল্প,\nসোনালি জরির ছোঁয়ায়— সাজুক আপনার প্রতিটি মুহূর্ত ।।"\n\nনাম:  মাহেশ্বরী` },
  { name: "মায়াবিনী",price: "₹১৬৪৯", img: "images/sharee-16.jpg", about: `"  মাটির রঙে মিশে থাকা সোনালি আভা,\nজরির নকশায় লুকিয়ে থাকা এক টুকরো মায়া..... ।।"\n\nনাম:  গ্লাস টিসু` },
  { name: "রক্তিমা -২",price: "₹৮৯৯", img: "images/sharee-17.jpg", about: `"  রক্তিম রঙে ভালোবাসার আবেশ ।।"\n\nনাম:  মাহেশ্বরী কটন` },
  { name: "অমলতাস",price: "₹১০৪৯", img: "images/sharee-18.jpg", about: `"  শিউলির গন্ধে ভোর নামে, মায়ের আগমনী সুরে ।।"\n\nনাম:  লিনেন টিস্যু` },
  { name: "মৃণালিনী",price: "₹১০৪৯", img: "images/sharee-24.jpeg", about: `"  "\n\nনাম:  রেশম কোটা` },
  { name: "তুঁতে মাধুরী",price: "₹১৯৯৯",img: "images/sharee-25.jpeg", about: `"  "\n\nনাম:  টিস্যু পৈঠানি` }
];

/* ═══════ এর নিচে কিছু বদলানোর দরকার নেই ═══════ */

(function () {
  var tints = ["#8E1B2E,#C2415A","#1F3C63,#3E6EA8","#CFC7AF,#E8E2D2","#D8A24A,#F0D08A",
               "#2C5E4F,#4E8A73","#4A2C62,#7C5498","#6E5232,#A57C49","#8A8D96,#C4C7CE"];
  var bnDigits = "০১২৩৪৫৬৭৮৯";
  function bn(t) { return String(t).replace(/[0-9]/g, function (d) { return bnDigits[+d]; }); }
  function tintOf(i) { return "linear-gradient(150deg," + tints[i % tints.length] + ")"; }
  // each saree's page name comes from its photo name, e.g. sharee-2
  function sid(s, i) { return s.img ? s.img.split("/").pop().replace(/\.[^.]+$/, "") : String(i + 1); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  var homeUrl = location.pathname;

  document.getElementById("mainWa").href =
    "https://wa.me/" + PHONE + "?text=" + encodeURIComponent("নমস্কার, আমি আপনাদের শাড়িগুলি দেখতে চাই।");
  document.getElementById("yr").textContent = bn(new Date().getFullYear());

  var want = new URLSearchParams(location.search).get("s");
  var idx = -1;
  if (want) {
    for (var k = 0; k < SAREES.length; k++) if (sid(SAREES[k], k) === want) { idx = k; break; }
  }
  if (idx >= 0) { showProduct(SAREES[idx], idx); return; }
  if (want) {
    var note = el("p", "notice", "এই শাড়িটি আর পাওয়া যাচ্ছে না। নিচে বাকি শাড়িগুলি দেখুন।");
    document.getElementById("listView").prepend(note);
  }
  showGrid();

  /* ── all sarees ── */
  function showGrid() {
    var grid = document.getElementById("grid");
    SAREES.forEach(function (s, i) {
      var link = "?s=" + encodeURIComponent(sid(s, i));
      var card = el("article", "card");

      // var pic = el(s.sold ? "div" : "a", "pic");
      // if (!s.sold) { pic.href = link; pic.setAttribute("aria-label", s.name);
      var pic = el(s.sold ? "div" : "a", "pic");
      if (!s.sold) { pic.href = link; pic.setAttribute("aria-label", s.name);}
      if (s.img) {
        var im = el("img");
        im.src = s.img; im.alt = s.name; im.loading = "lazy";
        im.onerror = function () { pic.style.background = tintOf(i); this.remove(); };
        pic.appendChild(im);
      } else {
        pic.style.background = tintOf(i);
      }
      if (s.sold) pic.appendChild(el("div", "sold", "বিক্রি হয়ে গেছে"));

      var body = el("div", "card-body");
      body.appendChild(el("h3", null, s.name));
      body.appendChild(el("p", "price", s.price));
      // if (!s.sold) {
      //   var a = el("a", "ask", "এই শাড়িটি সম্পর্কে জানুন");
      //   a.href = link;
      //   body.appendChild(a);
      // }
      var a = el("a", "ask", "এই শাড়িটি সম্পর্কে জানুন");
      a.href = link;
      body.appendChild(a);
      card.appendChild(pic);
      card.appendChild(body);
      grid.appendChild(card);
    });
  }

  /* ── one saree ── */
  function showProduct(s, i) {
    document.getElementById("listView").hidden = true;
    var view = document.getElementById("productView");
    view.hidden = false;
    document.title = s.name + " — মেঘবরণী";

    var back = el("a", "back", "← সব শাড়ি দেখুন");
    back.href = homeUrl;
    view.appendChild(back);

    var layout = el("div", "layout");

    // photos
    var gallery = el("div");
    var photo = el("div", "photo");
    var all = [];
    if (s.img) all.push(s.img);
    (s.photos || []).forEach(function (x) { if (x) all.push(x); });
    var big = null;
    if (all.length) {
      big = el("img");
      big.src = all[0]; big.alt = s.name;
      big.onerror = function () { photo.classList.add("empty"); photo.style.background = tintOf(i); this.remove(); };
      photo.appendChild(big);
    } else {
      photo.classList.add("empty");
      photo.style.background = tintOf(i);
    }
    if (s.sold) photo.appendChild(el("span", "soldtag", "বিক্রি হয়ে গেছে"));
    gallery.appendChild(photo);

    if (all.length > 1 && big) {
      var thumbs = el("div", "thumbs");
      all.forEach(function (src, n) {
        var b = el("button");
        b.type = "button";
        b.setAttribute("aria-label", "ছবি " + bn(n + 1));
        b.setAttribute("aria-current", n === 0 ? "true" : "false");
        var t = el("img"); t.src = src; t.alt = "";
        b.appendChild(t);
        b.addEventListener("click", function () {
          big.src = src;
          Array.prototype.forEach.call(thumbs.children, function (x) { x.setAttribute("aria-current", "false"); });
          b.setAttribute("aria-current", "true");
        });
        thumbs.appendChild(b);
      });
      gallery.appendChild(thumbs);
    }

    // text + WhatsApp
    var info = el("div", "info");
    info.appendChild(el("h1", null, s.name));
    info.appendChild(el("p", "p-price", s.price));
    info.appendChild(el("p", "about", s.about || "এই শাড়িটি সম্পর্কে আরও জানতে বা আরও ছবি দেখতে হোয়াটসঅ্যাপে বার্তা পাঠান।"));

    var msg = s.sold
      ? "নমস্কার, " + s.name + " শাড়িটি বিক্রি হয়ে গেছে দেখলাম। এরকম আর কোনো শাড়ি আছে কি?"
      : "নমস্কার, আমি " + s.name + " (" + s.price + ") শাড়িটি সম্পর্কে জানতে চাই।";
    var wa = el("a", "wa-btn", s.sold ? "এরকম শাড়ি আছে কিনা জানুন" : "হোয়াটসঅ্যাপে জানুন");
    wa.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(msg);
    wa.target = "_blank"; wa.rel = "noopener";
    info.appendChild(wa);
    info.appendChild(el("p", "hint", "বার্তার সঙ্গে এই শাড়ির নাম যাবে, তাই আমরা বুঝতে পারব আপনি কোনটার কথা বলছেন।"));

    layout.appendChild(gallery);
    layout.appendChild(info);
    view.appendChild(layout);
  }
})();
</script>
</body>
</html>
